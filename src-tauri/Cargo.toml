[package]
name = "app"
version = "1.2.0"
description = "AuthKeeper - Aplikasi Desktop Offline Manajemen TOTP"
authors = ["MUKHAMAD IRFAN"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
rusqlite = { version = "0.31", features = ["bundled"] }
bcrypt = "0.16"
rand = "0.8"
aes-gcm = "0.10"
base32 = "0.5"
totp-rs = { version = "5", features = ["gen_secret", "otpauth"] }
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
base64 = "0.22"
